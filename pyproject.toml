[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-redmine-expert"
dynamic = ["version"]
description = "Library for communicating with a Redmine project management application (expert fork)"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Maxim Tepkeev"}]
maintainers = [{name = "expert Zentrale"}]
keywords = ["redmine", "redminelib", "redmine_expert_helpdesk", "redmine_expert_agile"]
requires-python = ">=3.10"
dependencies = ["requests>=2.32"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Internet :: WWW/HTTP",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
docs = ["sphinx>=7", "sphinxcontrib-jquery", "alabaster"]
dev = ["python-redmine-expert[test,docs]", "ruff>=0.6", "build", "twine"]

[project.urls]
Source = "https://github.com/expertZentrale/python-redmine"
Changelog = "https://github.com/expertZentrale/python-redmine/blob/master/CHANGELOG.rst"
Upstream = "https://github.com/maxtepkeev/python-redmine"

[tool.setuptools.dynamic]
version = {attr = "redminelib.version.__version__"}

[tool.setuptools.packages.find]
include = ["redminelib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=redminelib --cov-report=term-missing"

[tool.coverage.run]
source = ["redminelib"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs/conf.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# raise-without-from: kept as is to preserve upstream exception chaining behaviour
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # public re-exports

[tool.ruff.format]
quote-style = "single"
