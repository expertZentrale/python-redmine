name: Docs

on:
  push:
    paths: ['docs/**', '.github/workflows/docs.yml', 'CHANGELOG.rst', 'redminelib/**']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml', 'CHANGELOG.rst', 'redminelib/**']

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -e .[docs]
      - name: Build docs
        run: sphinx-build -b html -n -W --keep-going -j auto docs docs/_build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/
