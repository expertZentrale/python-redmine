name: Docs

on:
  push:
    paths: ['docs/**', '.github/workflows/docs.yml', 'CHANGELOG.rst', 'redminelib/**']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs.yml', 'CHANGELOG.rst', 'redminelib/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -e .[docs]
      - name: Build docs
        run: sphinx-build -b html -n -W --keep-going -j auto docs docs/_build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: docs/_build/

  deploy:
    # Publishes the docs to GitHub Pages for every docs change on master
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
